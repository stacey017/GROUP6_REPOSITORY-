[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "medicare-heart-risk-screening"
version = "1.0.0"
description = "Educational Streamlit demo for a heart disease screening model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib==1.6.0",
    "pandas==3.0.6",
    "scikit-learn==1.6.1",
    "streamlit==1.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
